name: Build

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Compile and smoke test
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Compile all Java sources
        run: |
          mkdir -p out
          javac -encoding UTF-8 -d out src/*.java

      - name: Smoke test CLI
        run: |
          java -cp out Main examples/test.uni --run
